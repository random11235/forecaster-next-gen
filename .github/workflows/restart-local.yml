name: Restart local app

# Each merge to main, however it's made, restarts the dev's local app (http://127.0.0.1:5180/) once CI's run on it
# completes green, from main's tip, after that run's release job has pushed the version it sets
# (docs/design/architecture.md#release), so the footer shows it. That push starts no workflow, so this waits for CI's
# run rather than a push. A red run (a check, the browser check or the release failing) leaves the app from before
# running, on its own version. It runs on the self-hosted runner on the dev's Mac, which scripts/setupRunner.sh sets
# up. The app runs from the runner's own checkout, not the dev's working copy, so switching branches or running the
# tests there leaves it serving main. Only CI's run on a push to main starts it, never a pull request's, and it checks
# out main, so no fork's code runs on the dev's machine. With the Mac asleep or the runner stopped, the run waits in
# the queue until the runner comes back, for up to 24 hours: GitHub cancels it after that, and
# `gh workflow run restart-local.yml --ref main` restarts the app by hand.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # scripts/setupRunner.sh runs it once, on main, to check the new runner

# A newer merge's run replaces one still waiting; one already restarting finishes first.
concurrency:
  group: restart-local
  cancel-in-progress: false

# Read only, as a job that writes raises its own: only factory.yml may write to issues (factory/factoryTrust.ts)
permissions:
  contents: read

jobs:
  restart:
    # by hand on main, or after CI's run on a push to main passes; `branches` alone would let in a pull request from a
    # fork's own branch named main
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'))
    # The repo is public, so any job on this runner runs on the dev's Mac. Only this workflow uses it, and only from
    # main. A job triggered by `pull_request` or `pull_request_target`, or that checks out a ref a PR controls, never
    # runs here: that would run a fork's code on the dev's machine. Use `ubuntu-latest` for those.
    runs-on: [self-hosted, macOS, forecaster-dev]
    timeout-minutes: 15
    steps:
      # checkout cleans the folder, untracked and ignored files too, so the app's data lives outside it: the runner's
      # .env names the working copy's data file, as scripts/setupRunner.sh writes it. The message has no apostrophe:
      # macOS's bash 3.2 reads one inside "${…:?…}" as an opening quote, and the step then can't parse.
      - name: Data file outside the checkout
        run: |
          : "${FORECASTER_DATA_FILE:?is unset: run scripts/setupRunner.sh, which sets it in the .env of the runner}"
          echo "The app keeps its data in $FORECASTER_DATA_FILE"
      # main's tip, the release commit included, not the merge CI ran on
      - uses: actions/checkout@v7
        with:
          ref: main
      - run: npm ci
      - run: npm run build
      # If the install or build fails, this step doesn't run: the run fails, and the app from before keeps running
      # as it was, on its own version. If the app doesn't come up, the script fails with its output.
      - name: Restart the app
        run: scripts/restartLocal.sh
