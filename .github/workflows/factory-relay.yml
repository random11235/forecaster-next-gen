name: Factory relay

# A question asked on a line of a PR's diff (a review comment that mentions @claude) reaches factory.yml through here.
# GitHub runs a `pull_request_review_comment` workflow from the PR's own merge ref, so a PR that changes factory.yml
# would run its own copy with the factory's secrets. This workflow holds none: it uploads the comment's id alone, and
# its completed run starts factory.yml's `workflow_run`, which GitHub runs from the default branch. The factory fetches
# the comment by that id itself and decides from what the API says whether it asks anything (scripts/factoryQuestion.ts),
# so a PR that changes this file can at most name another comment, which must still be a trusted @claude question.
# A PR with a merge conflict starts no `pull_request_review_comment` run: ask in a conversation comment there.

on:
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  relay:
    if: >-
      contains(github.event.comment.body, '@claude')
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Name the comment
        env:
          ID: ${{ github.event.comment.id }}
        run: mkdir -p "$RUNNER_TEMP/relay" && printf '%s\n' "$ID" > "$RUNNER_TEMP/relay/comment-id"
      - uses: actions/upload-artifact@v7
        with:
          name: review-comment
          path: ${{ runner.temp }}/relay
          retention-days: 1
