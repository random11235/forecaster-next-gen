# Publishes the browser build (#57) to GitHub Pages on each push to main, for testers to open from a link.
# The site is the one page `npm run build:web` writes, served as index.html. Needs the repo's Pages source set to
# "GitHub Actions" (Settings → Pages); see the README's Sharing section.
name: Publish browser build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one publish at a time; a newer push waits, and a publish under way is not cut short
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Site from the one page
        run: |
          mkdir -p site
          cp dist/web/forecaster.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
