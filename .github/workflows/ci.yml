name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the migration check reads main's schema
      - uses: ./.github/actions/setup
      # `npm run check:ci` and `npm run check`, which the pre-push hook runs, run one list of checks (`check:static`: the
      # typecheck, the migration check, and Prettier, the 5,000-token limit and the change-file check on the files this
      # branch changes since CHECK_BASE), so a check added there runs in both. Then `check` runs every test; `check:ci`
      # runs them with coverage, all but the benchmark, which the next step runs on its own.
      - name: Checks and tests, with test coverage
        env:
          CHECK_BASE: origin/${{ github.base_ref || 'main' }}
        run: |
          set -o pipefail
          npm run check:ci | tee test-coverage.txt
      # timed apart from coverage, whose instrumentation slows the engine several times over
      - name: Benchmark
        run: npx vitest run test/engine/benchmark.test.ts
      - name: Usage coverage
        run: |
          set -o pipefail
          npm run coverage:usage | tee usage-coverage.txt
      - name: Coverage summary
        if: always()
        run: |
          for report in "Test coverage:test-coverage.txt" "Usage coverage (the running app, walked):usage-coverage.txt"; do
            title=${report%%:*}; file=${report#*:}
            [ -f "$file" ] || continue
            { echo "### $title"; echo '```'; sed -n '/^-*|/,$p' "$file"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            coverage/
            coverage-usage/

  # Drives the local app and the web build in Chrome as the EM would (scripts/browserCheck.ts): each opens empty, takes
  # a milestone and pace on Inputs, then shows their forecast with no error in the page. A failure keeps a screenshot.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Chrome for Testing, and the libraries it needs on Linux
      - run: npx agent-browser install --with-deps
      - run: npm run check:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-check
          path: reports/browser/
          if-no-files-found: ignore

  # Mutation tests the source a pull request changes (scripts/mutateDiff.ts). It reports the score and fails only if
  # Stryker can't run; a push to main has no branch to diff, so it runs on pull requests alone.
  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the diff starts at the merge-base with the base branch
      - uses: ./.github/actions/setup
      - name: Mutation tests
        run: |
          set -o pipefail
          npm run test:mutation -- origin/${{ github.base_ref }} | tee mutation.txt
      - name: Mutation summary
        if: always()
        run: |
          [ -f mutation.txt ] || exit 0
          echo '### Mutation testing (the source this pull request changes)' >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'nothing to mutate' mutation.txt; then
            grep 'nothing to mutate' mutation.txt >> "$GITHUB_STEP_SUMMARY"
          else
            { echo '```'; grep -E '\|$' mutation.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore

  # Each merge to main is a release an EM can name and run (#241, #288): once the checks and the browser check pass, the
  # release sets the version from the change files each PR adds (`changes/<ticket>.md`, its bump and changelog line), so
  # no two PRs edit the same line. scripts/releaseTag.ts, on main's tip, raises the last release's version by the biggest
  # bump, sets it in package.json and package-lock.json (every screen's footer shows it), adds its section to the top of
  # CHANGELOG.md, deletes the change files, commits and tags `v` and the version; this job pushes both and a GitHub
  # release carries the built app and the web build's page. A red check runs no release, so makes no tag. With no
  # change file on main's tip (a docs-only merge, or one an earlier release took in) it releases nothing. The commit is
  # pushed with the job's token, which starts no workflow, so CI doesn't run again on it; restart-local.yml waits for
  # this run instead. `check:static` refuses, before merge, a branch that changes the app with no change file. Checked
  # by a real merge, not by tests.
  release:
    needs: [check, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to push the release commit and its tag, and create the release
    # One release at a time: a later merge waits for the one before to push. A merge in before the release runs is on
    # main's tip, so releases with it, as one version; the later merge's release then finds no change file. If main
    # moves on while a release runs, its push is refused and the job fails: re-run it, and it releases from the new tip.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # main's tip, which an earlier release may have committed to since this merge
          fetch-depth: 0 # the tags, to find the last release, and main's merges, for each change file's PR
      - uses: ./.github/actions/setup
      - id: version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/releaseTag.ts >> "$GITHUB_OUTPUT"
      # builds the app into dist/ and the web build's page into dist/web/forecaster.html, of the version just set
      - if: steps.version.outputs.new == 'true'
        run: npm run build:web
      # the release commit and its tag together, or neither; only once the build has passed
      - if: steps.version.outputs.new == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git push --atomic origin HEAD:main "refs/tags/$TAG"
      # The app runs from its archive as from a checkout: unpack it, `npm ci`, then `node dist/app/main.js`.
      # package.json is the version it reads; the fonts come from its packages, so the dev ones are needed too.
      - name: Release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          tar -czf "forecaster-$TAG.tar.gz" --exclude=dist/web dist package.json package-lock.json
          cp dist/web/forecaster.html "forecaster-$TAG.html"
          gh release create "$TAG" --verify-tag --title "Forecaster $TAG" --generate-notes \
            "forecaster-$TAG.tar.gz" "forecaster-$TAG.html"
