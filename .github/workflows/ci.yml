name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read only, as a job that writes raises its own: only factory.yml may write to issues (scripts/factoryTrust.ts)
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the migration check reads origin/main's schema, and the stored-values test its snapshot
      - uses: ./.github/actions/setup
      # `npm run check:ci` and `npm run check`, which the pre-push hook runs, run one list of checks (`check:static`: the
      # typecheck, the module-boundary check (`lint:boundaries`), the migration check, and Prettier, the 5,000-token
      # limit and the change-file check on the files this branch changes since CHECK_BASE), so a check added there runs
      # in both. Then `check` runs every test; `check:ci` runs them with coverage (`test:coverage`), all but the
      # benchmark, which the next step runs on its own.
      - name: Checks and tests, with test coverage
        env:
          CHECK_BASE: origin/${{ github.base_ref || 'main' }}
        run: |
          set -o pipefail
          npm run check:ci | tee test-coverage.txt
      # timed apart from coverage, whose instrumentation slows the engine several times over
      - name: Benchmark
        run: npx vitest run test/engine/benchmark.test.ts
      - name: Usage coverage
        run: |
          set -o pipefail
          npm run coverage:usage | tee usage-coverage.txt
      # Each module's coverage by its own test folder alone (scripts/ownFolderCoverage.ts): fails when one drops below
      # its threshold, so behaviour tested only at an outer layer can't creep in. Its Markdown report goes to stdout.
      - name: Coverage by each module's own tests
        if: always()
        run: npm run --silent coverage:folders > own-folder-coverage.md
      - name: Coverage summary
        if: always()
        run: |
          for report in "Test coverage:test-coverage.txt" "Usage coverage (the running app, walked):usage-coverage.txt"; do
            title=${report%%:*}; file=${report#*:}
            [ -f "$file" ] || continue
            { echo "### $title"; echo '```'; sed -n '/^-*|/,$p' "$file"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
          if [ -f own-folder-coverage.md ]; then
            { echo "### Coverage by each module's own tests"; cat own-folder-coverage.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
      # A report, not a check (scripts/moduleDepth.ts): the entry points exporting the most per line they hide.
      # It never fails the build.
      - name: Shallowest modules
        if: always()
        continue-on-error: true
        run: node scripts/reportShallowModules.ts >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            coverage/
            coverage-usage/
            coverage-folders/

  # Drives the local app and the web build in Chrome as the EM would (scripts/browserCheck.ts): each opens empty, takes
  # a milestone and pace on Inputs, then shows their forecast with no error in the page. A failure keeps a screenshot.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Chrome for Testing, and the libraries it needs on Linux
      - run: npx agent-browser install --with-deps
      - run: npm run check:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-check
          path: reports/browser/
          if-no-files-found: ignore

  # Mutation tests only the lines of source a pull request adds or changes (scripts/mutateDiff.ts). It reports the
  # score and the survivors (scripts/mutationSummary.ts), and fails only if Stryker can't run; the uploaded report
  # keeps mutation.json and targets.json for counting survivors across pull requests. A push to main has no branch to
  # diff, so it runs on pull requests alone.
  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the diff starts at the merge-base with the base branch
      - uses: ./.github/actions/setup
      - name: Mutation tests
        # Stops itself inside the job's 30 minutes, so the summary below still runs and can say it ran out of time:
        # GitHub reports a job its timeout kills only as cancelled. timeout signals Stryker's workers too, as its group.
        run: |
          set -o pipefail
          status=0
          timeout --kill-after=1m 25m npm run test:mutation -- origin/${{ github.base_ref }} | tee mutation.txt || status=$?
          if [ "$status" -eq 124 ]; then touch mutation-timed-out; fi
          exit "$status"
      - name: Mutation summary
        if: always()
        run: |
          [ -f mutation.txt ] || exit 0
          echo '### Mutation testing (the source lines this pull request changes)' >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'nothing to mutate' mutation.txt; then
            grep 'nothing to mutate' mutation.txt >> "$GITHUB_STEP_SUMMARY"
          elif grep -qE '^All files +\|' mutation.txt; then
            { echo '```'; grep -E '\|$' mutation.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            # the survivors, counted per line mutated and listed one by one (docs/research/mutation-survivors.md)
            { echo; node scripts/mutationSummary.ts; } >> "$GITHUB_STEP_SUMMARY"
          else
            # no report from Stryker: say why, rather than fail here too
            if [ -f mutation-timed-out ]; then
              echo "The mutation tests ran out of time (25 minutes) before their report. Their last progress:" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "The mutation tests stopped before their report. Their last progress:" >> "$GITHUB_STEP_SUMMARY"
            fi
            { echo '```'; grep 'Mutation testing' mutation.txt | tail -1 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore

  # Each merge to main is a release: once the checks and the browser check pass, scripts/release.ts commits, tags and
  # pushes the version the change files set, and a GitHub release of the last tag carries the built app and the web
  # build's page. docs/design/architecture.md#release sets it out. Checked by a real merge; the script by
  # test/scripts/release.run.test.ts.
  release:
    needs: [check, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to push the release commit and its tag, and create the release
    env:
      HUSKY: '0' # no git hooks: the job commits only what release.ts writes and checks out only its own tag
    # One release at a time (docs/design/architecture.md#release says what a replaced one leaves).
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # main's tip, which a later merge or an earlier release may have moved on since this run's commit
          fetch-depth: 0 # the tags, to find the last release, and main's merges, for each change file's PR
      - uses: ./.github/actions/setup
      - id: release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/release.ts "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - id: published
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        # only "release not found" means unpublished; any other failure (auth, network) fails the step
        run: |
          if view=$(gh release view "$TAG" 2>&1); then echo published=true
          elif [[ "$view" == *"release not found"* ]]; then echo published=false
          else echo "$view" >&2; exit 1
          fi >> "$GITHUB_OUTPUT"
      # the app and the web build's page, dist/web/forecaster.html, as the tag holds them
      - if: steps.published.outputs.published == 'false'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git checkout --quiet "$TAG"
          npm ci
          npm run build:web
      # The app runs from its archive as from a checkout: unpack it, `npm ci`, then `node dist/app/main.js`.
      # package.json is the version it reads; the fonts come from its packages, so the dev ones are needed too.
      - name: Release
        if: steps.published.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          tar -czf "forecaster-$TAG.tar.gz" --exclude=dist/web dist package.json package-lock.json LICENSE
          cp dist/web/forecaster.html "forecaster-$TAG.html"
          gh release create "$TAG" --verify-tag --title "Forecaster $TAG" --generate-notes \
            "forecaster-$TAG.tar.gz" "forecaster-$TAG.html"
