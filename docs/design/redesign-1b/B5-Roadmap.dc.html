<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#F7F5F0}a{color:#1F5F6B}a:hover{color:#123F47}button{font:inherit;cursor:pointer}</style>
</helmet>
<div style="font-family: 'Geist', system-ui, sans-serif; color: #1C1B18; background: #F7F5F0; min-height: 100vh; font-size: 14px; display: grid; grid-template-columns: 244px minmax(0, 1fr)">
<dc-import name="B-Sidebar" active="roadmap" hint-size="244px,100%"></dc-import>
<main style="padding: 40px 56px 64px; max-width: 1100px; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 13px; color: #5E5A52">All teams · week of 12 Oct 2026</span>
<h1 style="margin: 0; font-size: 40px; line-height: 1.15; font-weight: 600; letter-spacing: -0.03em; max-width: 780px; text-wrap: pretty">3 of 5 milestones are at risk of missing their date.</h1>
</div>
<section style="display: flex; flex-direction: column">
<div style="display: grid; grid-template-columns: 220px minmax(0, 1fr) 60px; gap: 24px; border-bottom: 1px solid #1C1B18; padding-bottom: 8px">
<span style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em">Milestone</span>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr))"><sc-for list="{{months}}" as="m" hint-placeholder-count="6"><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #8C877C">{{m}}</span></sc-for></div>
<span style="font-size: 12px; font-weight: 600; text-align: right">Odds</span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: 220px minmax(0, 1fr) 60px; gap: 24px; align-items: center; min-height: 70px; border-bottom: 1px solid #E2DDD2">
<div style="display: flex; flex-direction: column; gap: 2px"><strong style="font-weight: 600; font-size: 15px">{{r.name}}</strong><span style="font-size: 12px; color: #5E5A52">{{r.team}}<sc-if value="{{r.hasDep}}" hint-placeholder-val="{{false}}"> · waits on {{r.dep}}</sc-if></span></div>
<div style="position: relative; height: 36px">
<div style="position: absolute; top: 0; bottom: 0; width: 1px; background: #8C877C; {{today}}"></div>
<div style="position: absolute; top: 16px; height: 4px; border-radius: 2px; {{r.barStyle}}"></div>
<div style="position: absolute; top: 10px; width: 16px; height: 16px; border-radius: 50%; {{r.p85Style}}"></div>
<div style="position: absolute; top: 6px; width: 0; height: 24px; border-left: 2px solid #1C1B18; {{r.commitStyle}}"></div>
</div>
<span style="font-family: 'Geist Mono', monospace; font-weight: 600; text-align: right; {{r.cStyle}}">{{r.chance}}</span>
</div>
</sc-for>
<div style="display: flex; gap: 20px; font-size: 12px; color: #5E5A52; padding-top: 14px">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 20px; height: 4px; border-radius: 2px; background: #1C1B18"></span>50% → 95%</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 50%; background: #1C1B18"></span>85% sure</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="height: 12px; border-left: 2px solid #1C1B18"></span>Committed</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="height: 12px; border-left: 1px solid #8C877C"></span>Today</span>
</div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:800}}">
class Component extends DCLogic {
  renderVals() {
    const start = Date.UTC(2026, 9, 1), span = Date.UTC(2027, 3, 1) - start;
    const pos = (y, m, d) => ((Date.UTC(y, m - 1, d) - start) / span * 100).toFixed(2) + '%';
    const col = c => c >= 85 ? '#2F6B3F' : c >= 60 ? '#B5482A' : '#8E1F1F';
    const raw = [
      { team: 'Platform', name: 'Observability migration', p50: [2026,11,6], p85: [2026,11,20], p95: [2026,12,4], commit: [2026,11,30], c: 92 },
      { team: 'Payments', name: 'Checkout v2', p50: [2026,12,11], p85: [2027,1,1], p95: [2027,1,15], commit: [2026,12,18], c: 67 },
      { team: 'Mobile', name: 'Push preferences', p50: [2026,11,27], p85: [2026,12,11], p95: [2026,12,25], commit: [2026,12,11], c: 84 },
      { team: 'Mobile', name: 'Offline mode', p50: [2027,1,15], p85: [2027,2,12], p95: [2027,3,5], commit: [2027,1,31], c: 58, dep: 'Card vaulting' },
      { team: 'Payments', name: 'Merchant onboarding', p50: [2027,1,22], p85: [2027,2,12], p95: [2027,2,26], commit: [2027,2,19], c: 88 }
    ];
    const rows = raw.map(r => ({ team: r.team, name: r.name, hasDep: !!r.dep, dep: r.dep || '', chance: r.c + '%', cStyle: 'color:' + col(r.c),
      barStyle: 'left:' + pos(...r.p50) + ';width:calc(' + pos(...r.p95) + ' - ' + pos(...r.p50) + ');background:' + col(r.c),
      p85Style: 'left:calc(' + pos(...r.p85) + ' - 8px);background:' + col(r.c), commitStyle: 'left:calc(' + pos(...r.commit) + ' - 1px)' }));
    return { months: ['Oct', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar'], rows, today: 'left:' + pos(2026, 10, 13) };
  }
}
</script>
</body>
</html>
